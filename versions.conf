# ==============================================================================
# toeyvpnv2 - Binary Versions & Checksum Configurations
# Path: versions.conf
# ==============================================================================

# Xray-core
XRAY_VER="v1.8.24"

# Hysteria 2
HYSTERIA_VER="v2.5.2"

# ZIVPN UDP
ZIVPN_VER="1.4.9"

# UDP Custom (ดาวน์โหลดจาก Release ส่วนตัวของผู้ดูแลระบบ)
UDPCUSTOM_VER="v1.0.0"
UDPCUSTOM_URL_AMD64="https://raw.githubusercontent.com/jannarong01/toeyvpn/main/udp-custom-linux-amd64"
UDPCUSTOM_URL_ARM64="https://raw.githubusercontent.com/jannarong01/toeyvpn/main/udp-custom-linux-arm"

# BadVPN UDPGW
BADVPN_VER="master"

# ------------------------------------------------------------------------------
# SHA256 Checksums (ใส่ค่า hash จริงเพื่อป้องกัน supply-chain attack)
# หากยังไม่ได้คำนวณ ให้ปล่อยว่างไว้ ระบบจะข้ามการตรวจสอบเฉพาะ hash แต่ยังตรวจขนาดไฟล์
# ------------------------------------------------------------------------------
SHA256_XRAY_AMD64=""
SHA256_XRAY_ARM64=""
SHA256_HYSTERIA_AMD64=""
SHA256_HYSTERIA_ARM64=""
SHA256_ZIVPN_AMD64=""
SHA256_ZIVPN_ARM64=""
SHA256_UDPCUSTOM_AMD64=""
SHA256_UDPCUSTOM_ARM64=""
